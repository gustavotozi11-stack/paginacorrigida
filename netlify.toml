[build]
  publish = "."

[[redirects]]
  from = "/images/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/imagens/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Access-Control-Allow-Origin = "*"
